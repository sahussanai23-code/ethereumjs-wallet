<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                >
                <button id="addBtn" class="btn btn-primary">Add Task</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span id="taskCount">0 tasks</span>
            <span id="completedCount">0 completed</span>
        </div>

        <div id="todoList" class="todo-list">
            <!-- To-dos will be inserted here -->
        </div>

        <div id="emptyState" class="empty-state">
            <p>📭 No tasks yet. Add one to get started!</p>
        </div>

        <div class="actions">
            <button id="clearCompleted" class="btn btn-secondary">Clear Completed</button>
            <button id="clearAll" class="btn btn-danger">Clear All</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
